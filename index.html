
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Hospital Fernández · Planos AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

/* =====================================
   ESTILOS GENERALES
===================================== */

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: transparent !important;
}

a-scene {
  position: fixed !important;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
  z-index: 1;
  background: transparent !important;
}

a-scene canvas.a-canvas {
  background: transparent !important;
}

/* =====================================
   MENSAJE SUPERIOR
===================================== */

#mensaje {
  position: fixed;
  top: max(12px,env(safe-area-inset-top));
  left: 5%;
  width: 90%;
  z-index: 55;
  text-align: center;
  color: white;
  background: rgba(14,29,43,.86);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 13px;
  line-height: 1.45;
  pointer-events: none;
}

/* =====================================
   BOTON FIJAR
===================================== */

#fijar {
  position: fixed;
  z-index: 60;
  bottom: max(26px,env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  background: #7921B5;
  border: 1px solid #E879FF;
  color: white;
  padding: 15px 22px;
  border-radius: 30px;
  white-space: nowrap;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 0 12px #BF00FF80;
}

/* =====================================
   VISOR DEL PLANO
===================================== */

#visor {
  position: fixed;
  inset: 70px 0 225px;
  z-index: 30;
  display: none;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  perspective: 900px;
}

/* Más espacio cuando el menú está cerrado */

body.menu-min #visor {
  bottom: 75px;
}

#modelo {
  position: relative;
  width: min(90vw,55vh);
  aspect-ratio: 1 / 1;
  flex: none;
  transform-style: preserve-3d;
  transform-origin: center;
  will-change: transform;
  touch-action: none;
}

#planta {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* =====================================
   MARCADORES VIOLETA NEON
===================================== */

#capas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.resaltado {
  fill: #A020F0;
  fill-opacity: 0.48;
  stroke: #E879FF;
  stroke-width: 4;
  filter:
    drop-shadow(0 0 5px #BF00FF)
    drop-shadow(0 0 12px #A020F0);
}

/* =====================================
   MENU DESLIZABLE
===================================== */

#panel {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 65;
  display: none;
  background: rgba(14,29,43,.97);
  color: white;
  border-radius: 20px 20px 0 0;
  overflow: hidden;
  max-height: 55vh;
  max-height: 55dvh;
  transform: translateY(0);
  transition: transform .28s ease;
  box-shadow: 0 -5px 20px #0005;
}

/* Menú minimizado: deja visible la barra */

body.menu-min #panel {
  transform: translateY(calc(100% - 56px));
}

#panel.arrastrando {
  transition: none;
}

/* Barra para arrastrar */

#tirador {
  height: 56px;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  background: rgba(39,55,78,.95);
}

#tirador:active {
  cursor: grabbing;
}

#barra {
  width: 48px;
  height: 5px;
  border-radius: 10px;
  background: #C47AFF;
  box-shadow: 0 0 9px #BF00FF;
}

#texto-tirador {
  font-size: 11px;
  color: #E9B3FF;
  font-weight: bold;
}

/* Contenido del menú */

#contenido-menu {
  padding: 10px 12px
    max(14px,env(safe-area-inset-bottom));
  overflow-y: auto;
  max-height: calc(55dvh - 56px);
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

#titulo {
  text-align: center;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 9px;
}

#pisos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

button {
  font-family: inherit;
  touch-action: manipulation;
  cursor: pointer;
  border-radius: 10px;
  border: 1px solid #5b7681;
  color: white;
  background: #284357;
  padding: 10px 6px;
  font-size: 12px;
}

button.activo {
  background: #7921B5;
  border-color: #E879FF;
  font-weight: bold;
  box-shadow: 0 0 10px #BF00FF70;
}

#subtitulo {
  font-size: 12px;
  text-align: center;
  color: #d8e9ee;
  margin: 10px 0;
}

/* =====================================
   SECTORES Y SUBSECTORES
===================================== */

#sectores {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.boton-principal {
  width: 100%;
  text-align: left;
  font-size: 13px;
  padding: 11px 13px;
  border-left: 5px solid #BF00FF;
}

.subsectores {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  padding: 5px 4px 5px 14px;
}

.subsectores.abierto {
  display: grid;
}

.boton-subsector {
  font-size: 12px;
  padding: 10px 7px;
  border-left: 4px solid #BF00FF;
  background: #334958;
}

#seleccion {
  text-align: center;
  color: #E9B3FF;
  font-size: 12px;
  min-height: 17px;
  margin: 9px 0;
}

/* =====================================
   BOTONES DE ACCION
===================================== */

#acciones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

#acciones button {
  background: #506478;
  padding: 12px 7px;
}

#volverAR {
  grid-column: 1 / -1;
  background: #7921B5 !important;
  border-color: #E879FF;
  font-size: 14px;
  font-weight: bold;
}

/* Scanner oculto solamente en modo fijo */

body.fijado .mindar-ui-scanning {
  display: none !important;
}

</style>
</head>

<body>

<!-- =====================================
     MENSAJE INICIAL
===================================== -->

<div id="mensaje">
  Escaneá la lámina para visualizar el plano
  en realidad aumentada.
</div>

<!-- =====================================
     FIJAR EN PANTALLA
===================================== -->

<button id="fijar" type="button">
  📌 Fijar en pantalla
</button>

<!-- =====================================
     PLANO INTERACTIVO
===================================== -->

<div id="visor">
  <div id="modelo">

    <img
      id="planta"
      src="./planta-4piso.png"
      alt="Plano del Hospital Fernández"
      draggable="false">

    <svg
      id="capas"
      viewBox="0 0 1254 1254"
      preserveAspectRatio="none">
    </svg>

  </div>
</div>

<!-- =====================================
     MENU DESLIZABLE
===================================== -->

<div id="panel">

  <!-- Barra para minimizar o expandir -->

  <div
    id="tirador"
    role="button"
    tabindex="0"
    aria-label="Minimizar o expandir menú"
    aria-expanded="true">

    <div id="barra"></div>

    <div id="texto-tirador">
      ▼ Deslizá para minimizar
    </div>

  </div>

  <!-- Contenido del menú -->

  <div id="contenido-menu">

    <div id="titulo">
      Hospital Fernández · Explorar pisos
    </div>

    <div id="pisos">

      <button type="button" data-piso="PB">
        Planta Baja
      </button>

      <button type="button" data-piso="4">
        4.º Piso
      </button>

    </div>

    <div id="subtitulo">
      Seleccioná un sector o servicio
    </div>

    <div id="sectores"></div>

    <div id="seleccion"></div>

    <div id="acciones">

      <button type="button" id="limpiar">
        Limpiar sector
      </button>

      <button type="button" id="reiniciar">
        ↺ Reiniciar vista
      </button>

      <button type="button" id="volverAR">
        ↩ Volver a realidad aumentada
      </button>

    </div>

  </div>

</div>

<!-- =====================================
     REALIDAD AUMENTADA MINDAR
===================================== -->

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    uiScanning: yes;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
    warmupTolerance: 8;
    missTolerance: 10;
  "
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>

    <img
      id="ar-plano-img"
      src="./planta-4piso.png"
      crossorigin="anonymous">

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="marcador"
    mindar-image-target="targetIndex: 0">

    <a-plane
      id="ar-plano"
      position="0 0 0.3"
      width="1"
      height="1"
      material="
        src: #ar-plano-img;
        shader: flat;
        transparent: true;
        side: double;
        depthWrite: false;
      ">
    </a-plane>

  </a-entity>

</a-scene>

<script>

/* =====================================
   CONFIGURACION DE LOS DOS PISOS
===================================== */

const pisos = {

  /* ==================================
     CUARTO PISO
  ================================== */

  "4": {
    imagen: "./planta-4piso.png",
    ancho: 1254,
    alto: 1254,

    sectores: [

      {
        id: "1",
        nombre: "Administrativo",
        areas: [
          [539,498,181,100]
        ]
      },

      {
        id: "2",
        nombre: "Guardias",

        subsectores: [

          {
            id: "2.1",
            nombre: "Obstetricia / Ecografías",
            areas: [
              [729,547,220,73]
            ]
          },

          {
            id: "2.2",
            nombre: "Cuidados especiales",
            areas: [
              [729,642,219,75]
            ]
          }

        ]
      },

      {
        id: "3",
        nombre: "Internaciones",

        subsectores: [

          {
            id: "3.1",
            nombre: "Pediatría",
            areas: [
              [325,563,228,146]
            ]
          },

          {
            id: "3.2",
            nombre: "Ginecología",
            areas: [
              [207,737,106,391]
            ]
          },

          {
            id: "3.3",
            nombre: "Conjunta",
            areas: [
              [219,116,110,450]
            ]
          },

          {
            id: "3.4",
            nombre: "Neonatología",
            areas: [
              [945,116,110,450]
            ]
          }

        ]
      },

      {
        id: "4",
        nombre: "Centro Obstétrico",
        areas: [
          [948,744,107,353]
        ]
      },

      {
        id: "5",
        nombre: "Sector de acceso",
        areas: [
          [127,529,70,218],
          [550,674,177,95],
          [1052,520,69,221]
        ]
      }

    ]
  },

  /* ==================================
     PLANTA BAJA
  ================================== */

  "PB": {
    imagen: "./planta-baja.png",
    ancho: 1254,
    alto: 1254,

    sectores: [

      {
        id: "1",
        nombre: "Confirmación de Tokens",
        areas: [
          [545,576,146,66]
        ]
      },

      {
        id: "2",
        nombre: "Consultorios",

        subsectores: [

          {
            id: "2.1",
            nombre: "Pediatría / Neonatología",
            areas: [
              [859,671,62,445]
            ]
          },

          {
            id: "2.2",
            nombre: "Obstetricia / Ginecología",
            areas: [
              [973,709,62,445]
            ]
          }

        ]
      },

      {
        id: "3",
        nombre: "Laboratorio",
        areas: [
          [203,561,125,43]
        ]
      },

      {
        id: "4",
        nombre: "Mesón de turnos",
        areas: [
          [958,566,49,40]
        ]
      },

      {
        id: "5",
        nombre: "Sector de acceso",
        areas: [
          [127,582,82,129],
          [537,645,161,147],
          [1039,581,86,128]
        ]
      }

    ]
  }

};

/* =====================================
   ELEMENTOS
===================================== */

const $ = id =>
  document.getElementById(id);

const visor = $("visor");
const modelo = $("modelo");
const planta = $("planta");
const capas = $("capas");
const panel = $("panel");
const mensaje = $("mensaje");
const fijar = $("fijar");
const tirador = $("tirador");
const textoTirador = $("texto-tirador");
const marcador = $("marcador");
const planoAR = $("ar-plano");

/* =====================================
   ESTADO GENERAL
===================================== */

let detectado = false;
let targetVisible = false;
let fijado = false;
let pisoActual = "4";

let escala = 1;
let rotX = 0;
let rotY = 0;

let desplazamientoX = 0;
let desplazamientoY = 0;

/* Estado de gestos */

let gesto = "";
let ultimoX = 0;
let ultimoY = 0;

let distanciaInicial = 0;
let escalaInicial = 1;

let centroInicialX = 0;
let centroInicialY = 0;

let desplazamientoInicialX = 0;
let desplazamientoInicialY = 0;

const limitar = (valor,min,max) =>
  Math.max(min,Math.min(max,valor));

/* =====================================
   ACTUALIZAR VISTA
===================================== */

function actualizarVista() {

  modelo.style.transform = `
    translate(
      ${desplazamientoX}px,
      ${desplazamientoY}px
    )
    rotateX(${rotX}deg)
    rotateY(${rotY}deg)
    scale(${escala})
  `;

}

/* =====================================
   REINICIAR VISTA
===================================== */

function reiniciar() {

  escala = 1;
  rotX = 0;
  rotY = 0;

  desplazamientoX = 0;
  desplazamientoY = 0;

  gesto = "";

  actualizarVista();

}

/* =====================================
   LIMPIAR MARCADORES
===================================== */

function limpiar() {

  capas.replaceChildren();

  document.querySelectorAll(
    ".boton-principal,.boton-subsector"
  ).forEach(boton => {

    boton.classList.remove("activo");

  });

  $("seleccion").textContent = "";

}

/* =====================================
   DIBUJAR MARCADORES
===================================== */

function dibujarAreas(areas) {

  if (!areas) return;

  areas.forEach(([x,y,w,h]) => {

    const rect = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

    rect.setAttribute("x",x);
    rect.setAttribute("y",y);
    rect.setAttribute("width",w);
    rect.setAttribute("height",h);

    rect.setAttribute(
      "rx",
      Math.min(w,h)/4
    );

    rect.setAttribute(
      "class",
      "resaltado"
    );

    capas.appendChild(rect);

  });

}

/* =====================================
   SELECCIONAR SECTOR PRINCIPAL
===================================== */

function seleccionarPrincipal(sector,boton) {

  limpiar();

  if (sector.areas) {
    dibujarAreas(sector.areas);
  }

  if (sector.subsectores) {

    sector.subsectores.forEach(sub => {
      dibujarAreas(sub.areas);
    });

  }

  boton.classList.add("activo");

  $("seleccion").textContent =
    sector.id + " · " + sector.nombre;

}

/* =====================================
   SELECCIONAR SUBSECTOR
===================================== */

function seleccionarSubsector(sub,boton) {

  limpiar();

  dibujarAreas(sub.areas);

  boton.classList.add("activo");

  $("seleccion").textContent =
    sub.id + " · " + sub.nombre;

}

/* =====================================
   CREAR MENU DE SECTORES
===================================== */

function crearMenu() {

  const contenedor = $("sectores");

  contenedor.replaceChildren();

  const lista = pisos[pisoActual].sectores;

  lista.forEach(sector => {

    const principal =
      document.createElement("button");

    principal.type = "button";
    principal.className = "boton-principal";

    principal.textContent =
      sector.id + ". " +
      sector.nombre +
      (sector.subsectores ? " ▾" : "");

    contenedor.appendChild(principal);

    if (sector.subsectores) {

      const subMenu =
        document.createElement("div");

      subMenu.className = "subsectores";

      sector.subsectores.forEach(sub => {

        const boton =
          document.createElement("button");

        boton.type = "button";
        boton.className = "boton-subsector";

        boton.textContent =
          sub.id + ". " + sub.nombre;

        boton.addEventListener(
          "click",
          () => seleccionarSubsector(sub,boton)
        );

        subMenu.appendChild(boton);

      });

      contenedor.appendChild(subMenu);

      principal.addEventListener(
        "click",
        () => {

          const abierto =
            subMenu.classList.contains(
              "abierto"
            );

          document.querySelectorAll(
            ".subsectores"
          ).forEach(menu => {

            menu.classList.remove("abierto");

          });

          if (!abierto) {
            subMenu.classList.add("abierto");
          }

          seleccionarPrincipal(
            sector,
            principal
          );

        }
      );

    } else {

      principal.addEventListener(
        "click",
        () => seleccionarPrincipal(
          sector,
          principal
        )
      );

    }

  });

}

/* =====================================
   CAMBIAR DE PISO
===================================== */

function elegirPiso(piso) {

  if (!pisos[piso]) return;

  pisoActual = piso;

  const cfg = pisos[piso];

  planta.src = cfg.imagen;

  modelo.style.aspectRatio =
    cfg.ancho + " / " + cfg.alto;

  capas.setAttribute(
    "viewBox",
    `0 0 ${cfg.ancho} ${cfg.alto}`
  );

  crearMenu();

  document.querySelectorAll(
    "[data-piso]"
  ).forEach(boton => {

    boton.classList.toggle(
      "activo",
      boton.dataset.piso === piso
    );

  });

  limpiar();
  reiniciar();

}

/* =====================================
   NUEVO: MENU MINIMIZABLE
===================================== */

let menuMinimizado = false;

function establecerMenuMinimizado(valor) {

  menuMinimizado = valor;

  document.body.classList.toggle(
    "menu-min",
    valor
  );

  textoTirador.textContent = valor
    ? "▲ Deslizá para expandir"
    : "▼ Deslizá para minimizar";

  tirador.setAttribute(
    "aria-expanded",
    String(!valor)
  );

}

/* Arrastre de la barra */

let arrastreMenu = null;

tirador.addEventListener(
  "pointerdown",
  e => {

    if (!fijado) return;

    const alturaOculta =
      Math.max(0,panel.offsetHeight - 56);

    arrastreMenu = {
      inicioY: e.clientY,
      inicioOffset:
        menuMinimizado ? alturaOculta : 0,
      alturaOculta: alturaOculta
    };

    panel.classList.add("arrastrando");

    tirador.setPointerCapture(e.pointerId);

  }
);

tirador.addEventListener(
  "pointermove",
  e => {

    if (!arrastreMenu) return;

    const diferencia =
      e.clientY - arrastreMenu.inicioY;

    const posicion = limitar(
      arrastreMenu.inicioOffset +
      diferencia,
      0,
      arrastreMenu.alturaOculta
    );

    panel.style.transform =
      `translateY(${posicion}px)`;

  }
);

function terminarArrastreMenu(e) {

  if (!arrastreMenu) return;

  const diferencia =
    e.clientY - arrastreMenu.inicioY;

  let minimizar;

  if (Math.abs(diferencia) < 15) {

    /* Tocar la barra también alterna */

    minimizar = !menuMinimizado;

  } else if (diferencia > 35) {

    minimizar = true;

  } else if (diferencia < -35) {

    minimizar = false;

  } else {

    minimizar = menuMinimizado;

  }

  arrastreMenu = null;

  panel.classList.remove("arrastrando");
  panel.style.transform = "";

  establecerMenuMinimizado(minimizar);

}

tirador.addEventListener(
  "pointerup",
  terminarArrastreMenu
);

tirador.addEventListener(
  "pointercancel",
  () => {

    arrastreMenu = null;

    panel.classList.remove("arrastrando");
    panel.style.transform = "";

  }
);

/* Accesibilidad con teclado */

tirador.addEventListener(
  "keydown",
  e => {

    if (e.key === "Enter" ||
        e.key === " ") {

      e.preventDefault();

      establecerMenuMinimizado(
        !menuMinimizado
      );

    }

  }
);

/* =====================================
   RECONOCIMIENTO DEL MARCADOR
===================================== */

marcador.addEventListener(
  "targetFound",
  () => {

    targetVisible = true;
    detectado = true;

    if (fijado) return;

    fijar.style.display = "block";

    mensaje.textContent =
      "¡Plano detectado! Tocá «Fijar en pantalla» para explorar los pisos.";

  }
);

marcador.addEventListener(
  "targetLost",
  () => {

    targetVisible = false;

    if (fijado) return;

    fijar.style.display = "none";

    mensaje.textContent =
      "Apuntá la cámara hacia la lámina para visualizar el plano en RA.";

  }
);

/* =====================================
   FIJAR EN PANTALLA
===================================== */

fijar.addEventListener(
  "click",
  () => {

    if (!detectado || fijado) return;

    fijado = true;

    document.body.classList.add("fijado");

    /* Ocultar plano AR */

    planoAR.setAttribute("visible",false);

    fijar.style.display = "none";

    /* Mostrar visor y menú */

    visor.style.display = "flex";
    panel.style.display = "block";

    /* Menú expandido al entrar */

    establecerMenuMinimizado(false);

    /* Iniciar en el 4.º piso */

    elegirPiso("4");

    mensaje.innerHTML = `
      <strong>Plano fijado en pantalla</strong><br>
      1 dedo: girar · 2 dedos: mover<br>
      Pellizcá para ampliar o reducir
    `;

  }
);

/* =====================================
   NUEVO: VOLVER A REALIDAD AUMENTADA
===================================== */

function volverARealidadAumentada() {

  if (!fijado) return;

  /* Salir del modo fijo */

  fijado = false;

  document.body.classList.remove("fijado");

  establecerMenuMinimizado(false);

  panel.style.display = "none";
  visor.style.display = "none";

  /* Restaurar plano AR original */

  planoAR.setAttribute("visible",true);

  /* Limpiar y reiniciar el visor */

  limpiar();
  reiniciar();

  /* Volver al reconocimiento del póster */

  if (targetVisible) {

    fijar.style.display = "block";

    mensaje.textContent =
      "Realidad aumentada activa. El plano está vinculado a la lámina.";

  } else {

    fijar.style.display = "none";

    mensaje.textContent =
      "Escaneá nuevamente la lámina para visualizar el plano en realidad aumentada.";

  }

}

$("volverAR").addEventListener(
  "click",
  volverARealidadAumentada
);

/* =====================================
   BOTONES DE PISOS
===================================== */

document.querySelectorAll(
  "[data-piso]"
).forEach(boton => {

  boton.addEventListener(
    "click",
    () => elegirPiso(boton.dataset.piso)
  );

});

/* =====================================
   BOTONES LIMPIAR Y REINICIAR
===================================== */

$("limpiar").addEventListener(
  "click",
  limpiar
);

$("reiniciar").addEventListener(
  "click",
  reiniciar
);

/* =====================================
   GESTOS: ZOOM, ROTACION Y MOVIMIENTO
===================================== */

const distancia = (a,b) =>
  Math.hypot(
    a.clientX - b.clientX,
    a.clientY - b.clientY
  );

const centro = (a,b) => ({
  x: (a.clientX + b.clientX)/2,
  y: (a.clientY + b.clientY)/2
});

function iniciarDos(a,b) {

  gesto = "dos";

  distanciaInicial = distancia(a,b);
  escalaInicial = escala;

  const c = centro(a,b);

  centroInicialX = c.x;
  centroInicialY = c.y;

  desplazamientoInicialX =
    desplazamientoX;

  desplazamientoInicialY =
    desplazamientoY;

}

/* INICIO DEL TOQUE */

visor.addEventListener(
  "touchstart",
  e => {

    if (e.touches.length === 1) {

      gesto = "uno";

      ultimoX = e.touches[0].clientX;
      ultimoY = e.touches[0].clientY;

    } else if (e.touches.length === 2) {

      iniciarDos(
        e.touches[0],
        e.touches[1]
      );

    }

  },
  {passive:true}
);

/* MOVIMIENTO */

visor.addEventListener(
  "touchmove",
  e => {

    if (e.cancelable) {
      e.preventDefault();
    }

    /* Un dedo: rotación */

    if (
      e.touches.length === 1 &&
      gesto === "uno"
    ) {

      const dedo = e.touches[0];

      rotY = limitar(
        rotY +
        (dedo.clientX-ultimoX)*0.35,
        -70,
        70
      );

      rotX = limitar(
        rotX -
        (dedo.clientY-ultimoY)*0.30,
        -70,
        70
      );

      ultimoX = dedo.clientX;
      ultimoY = dedo.clientY;

      actualizarVista();

    }

    /* Dos dedos: mover y zoom */

    else if (
      e.touches.length === 2 &&
      gesto === "dos"
    ) {

      const a = e.touches[0];
      const b = e.touches[1];

      const c = centro(a,b);

      if (distanciaInicial > 0) {

        escala = limitar(
          escalaInicial *
          distancia(a,b) /
          distanciaInicial,
          0.5,
          3
        );

      }

      desplazamientoX =
        desplazamientoInicialX +
        c.x - centroInicialX;

      desplazamientoY =
        desplazamientoInicialY +
        c.y - centroInicialY;

      actualizarVista();

    }

  },
  {passive:false}
);

/* FINAL DEL TOQUE */

visor.addEventListener(
  "touchend",
  e => {

    if (e.touches.length === 0) {

      gesto = "";

    } else if (e.touches.length === 1) {

      gesto = "uno";

      ultimoX = e.touches[0].clientX;
      ultimoY = e.touches[0].clientY;

    } else if (e.touches.length === 2) {

      iniciarDos(
        e.touches[0],
        e.touches[1]
      );

    }

  }
);

visor.addEventListener(
  "touchcancel",
  () => {
    gesto = "";
  }
);

/* =====================================
   CONTROLES CON MOUSE
===================================== */

let mouse = false;

visor.addEventListener(
  "mousedown",
  e => {

    mouse = true;
    ultimoX = e.clientX;
    ultimoY = e.clientY;

  }
);

window.addEventListener(
  "mouseup",
  () => {
    mouse = false;
  }
);

visor.addEventListener(
  "mousemove",
  e => {

    if (!mouse) return;

    rotY = limitar(
      rotY +
      (e.clientX-ultimoX)*0.35,
      -70,
      70
    );

    rotX = limitar(
      rotX -
      (e.clientY-ultimoY)*0.30,
      -70,
      70
    );

    ultimoX = e.clientX;
    ultimoY = e.clientY;

    actualizarVista();

  }
);

/* =====================================
   INICIALIZACION
===================================== */

elegirPiso("4");

</script>

</body>
</html>
