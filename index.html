
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Hospital Fernández - Prueba AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #mensaje {
      position: fixed;
      top: 15px;
      left: 5%;
      width: 90%;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px;
      box-sizing: border-box;
      text-align: center;
      border-radius: 10px;
      z-index: 999;
    }
  </style>

  <script>
    AFRAME.registerComponent('detector', {
      init: function () {
        const mensaje = document.querySelector('#mensaje');

        this.el.addEventListener('targetFound', () => {
          mensaje.textContent = '¡PLANTA DETECTADA!';
        });

        this.el.addEventListener('targetLost', () => {
          mensaje.textContent = 'Buscando la planta...';
        });
      }
    });
  </script>
</head>

<body>

  <div id="mensaje">
    Buscando la planta...
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      mindar-image-target="targetIndex: 0"
      detector>

      <!-- Superficie verde -->
      <a-plane
        position="0 0 0.01"
        width="0.9"
        height="0.65"
        color="#00ff66"
        material="opacity: 0.65; side: double">
      </a-plane>

      <!-- Cubo rojo elevado -->
      <a-box
        position="0 0 0.20"
        width="0.25"
        height="0.25"
        depth="0.25"
        color="#ff3333"
        animation="property: rotation;
                   to: 360 360 0;
                   dur: 5000;
                   loop: true;
                   easing: linear">
      </a-box>

    </a-entity>

  </a-scene>
</body>
</html>
