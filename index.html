
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Hospital Fernández - Mapa Interactivo AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

/* MENSAJE SUPERIOR */
#mensaje {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  left: 5%;
  width: 90%;
  padding: 10px 12px;
  background: rgba(12, 25, 38, 0.85);
  color: white;
  text-align: center;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.5;
  z-index: 50;
  pointer-events: none;
}

/* Ocultar escáner tras reconocer la planta */
body.planta-detectada .mindar-ui-scanning {
  display: none !important;
}

/* VISOR DE LA PLANTA */
#visor {
  position: fixed;
  top: 12%;
  left: 0;
  width: 100%;
  height: 58%;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
  overflow: hidden;
  touch-action: none;
}

/* MODELO INTERACTIVO */
#modelo {
  position: relative;
  width: min(92vw, 65vh);
  aspect-ratio: 577 / 433;
  transform-style: preserve-3d;
  transform-origin: center;
  will-change: transform;
  touch-action: none;
}

/* IMAGEN TRANSPARENTE */
#planta {
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
  user-select: none;
}

/* RESALTADOS VERDES */
#capas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}

.resaltado {
  fill: #00e66b;
  fill-opacity: 0.57;
  stroke: #008b42;
  stroke-width: 3;
}

/* MENU INFERIOR */
#panel {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  padding: 12px 12px
           max(16px, env(safe-area-inset-bottom));
  background: rgba(13, 27, 42, 0.94);
  border-radius: 20px 20px 0 0;
  color: white;
  z-index: 60;
  display: none;
}

#titulo {
  text-align: center;
  font-weight: bold;
  font-size: 15px;
  margin-bottom: 10px;
}

#sectores {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

button {
  border: 1px solid #526777;
  border-radius: 10px;
  background: #26394c;
  color: white;
  font-size: 12px;
  padding: 11px 7px;
  cursor: pointer;
  touch-action: manipulation;
}

button.activo {
  background: #16a35c;
  border-color: #3dff9a;
  font-weight: bold;
}

#acciones {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

#acciones button {
  flex: 1;
  background: #41536a;
  font-size: 13px;
}
</style>
</head>

<body>

<!-- MENSAJE INICIAL -->
<div id="mensaje">
  Escaneá la planta del 4.º piso.
</div>

<!-- PLANO INTERACTIVO -->
<div id="visor">
  <div id="modelo">

    <img
      id="planta"
      src="./planta-4piso.png"
      alt="Planta del cuarto piso"
      draggable="false">

    <svg
      id="capas"
      viewBox="0 0 577 433"
      preserveAspectRatio="none">
    </svg>

  </div>
</div>

<!-- MENU DE SECTORES -->
<div id="panel">

  <div id="titulo">
    Hospital Fernández · 4.º Piso
  </div>

  <div id="sectores">

    <button data-sector="1">
      1. Administrativa
    </button>

    <button data-sector="2">
      2. Obstetricia Guardia
    </button>

    <button data-sector="3">
      3. Internación
    </button>

    <button data-sector="4">
      4. Acceso Sector
    </button>

    <button data-sector="5">
      5. Sector 5
    </button>

    <button data-sector="6">
      6. Sector 6
    </button>

  </div>

  <div id="acciones">

    <button id="limpiar">
      Limpiar
    </button>

    <button id="reiniciar">
      ↺ Reiniciar posición
    </button>

  </div>

</div>

<!-- CAMARA Y ESCANER MINDAR -->
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; uiScanning: yes;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="marcador"
    mindar-image-target="targetIndex: 0">
  </a-entity>

</a-scene>

<script>

/* =================================
   SECTORES DE LA PLANTA
   Coordenadas sobre 577 x 433
================================= */

const sectores = {

  1: [
    { x: 261, y: 174, w: 70, h: 50 }
  ],

  2: [
    { x: 330, y: 192, w: 84, h: 64 }
  ],

  3: [
    { x: 119, y: 27, w: 55, h: 167 },
    { x: 405, y: 27, w: 58, h: 167 },
    { x: 172, y: 193, w: 94, h: 65 }
  ],

  4: [
    { x: 92, y: 179, w: 34, h: 80 },
    { x: 254, y: 245, w: 75, h: 35 },
    { x: 461, y: 179, w: 30, h: 80 }
  ],

  5: [
    { x: 119, y: 260, w: 56, h: 150 }
  ],

  6: [
    { x: 405, y: 260, w: 59, h: 145 }
  ]

};

/* =================================
   ELEMENTOS
================================= */

const visor = document.getElementById("visor");
const modelo = document.getElementById("modelo");
const panel = document.getElementById("panel");
const capas = document.getElementById("capas");
const mensaje = document.getElementById("mensaje");
const marcador = document.getElementById("marcador");

let detectado = false;

/* Estado de transformacion */
let escala = 1;
let rotX = 0;
let rotY = 0;
let rotZ = 0;

let desplazamientoX = 0;
let desplazamientoY = 0;

/* Estado de gestos */
let modoGesto = "";
let ultimoX = 0;
let ultimoY = 0;

let distanciaInicial = 0;
let escalaInicial = 1;

let centroInicialX = 0;
let centroInicialY = 0;
let desplazamientoInicialX = 0;
let desplazamientoInicialY = 0;

/* =================================
   DETECCION UNA SOLA VEZ
================================= */

marcador.addEventListener("targetFound", () => {

  if (detectado) return;

  detectado = true;

  // Mostrar planta y menú
  visor.style.display = "flex";
  panel.style.display = "block";

  // Ocultar el escáner definitivamente
  document.body.classList.add("planta-detectada");

  // Mostrar instrucciones tras detectar
  mensaje.innerHTML = `
    <strong>¡Planta detectada!</strong><br>
    1 dedo: girar · 2 dedos: mover<br>
    Pellizcá con 2 dedos para ampliar o reducir
  `;

  actualizarVista();

});

/* =================================
   RESALTADO DE SECTORES
================================= */

function seleccionarSector(numero) {

  capas.innerHTML = "";

  document.querySelectorAll("[data-sector]")
    .forEach(boton => {
      boton.classList.remove("activo");
    });

  const areas = sectores[numero];

  if (!areas) return;

  areas.forEach(area => {

    const figura = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

    figura.setAttribute("x", area.x);
    figura.setAttribute("y", area.y);
    figura.setAttribute("width", area.w);
    figura.setAttribute("height", area.h);
    figura.setAttribute("rx", 12);
    figura.setAttribute("class", "resaltado");

    capas.appendChild(figura);

  });

  const boton = document.querySelector(
    `[data-sector="${numero}"]`
  );

  if (boton) {
    boton.classList.add("activo");
  }
}

document.querySelectorAll("[data-sector]")
  .forEach(boton => {

    boton.addEventListener("click", () => {
      seleccionarSector(boton.dataset.sector);
    });

  });

/* LIMPIAR SELECCION */

document.getElementById("limpiar")
  .addEventListener("click", () => {

    capas.innerHTML = "";

    document.querySelectorAll("[data-sector]")
      .forEach(boton => {
        boton.classList.remove("activo");
      });

  });

/* =================================
   ROTACION, ZOOM Y MOVIMIENTO
================================= */

function actualizarVista() {

  modelo.style.transform = `
    translate(${desplazamientoX}px, ${desplazamientoY}px)
    perspective(850px)
    rotateX(${rotX}deg)
    rotateY(${rotY}deg)
    rotateZ(${rotZ}deg)
    scale(${escala})
  `;
}

function distancia(a, b) {
  return Math.hypot(
    a.clientX - b.clientX,
    a.clientY - b.clientY
  );
}

function centroDedos(a, b) {
  return {
    x: (a.clientX + b.clientX) / 2,
    y: (a.clientY + b.clientY) / 2
  };
}

/* INICIO DE GESTOS */

visor.addEventListener("touchstart", e => {

  if (e.touches.length === 1) {

    modoGesto = "rotacion";

    ultimoX = e.touches[0].clientX;
    ultimoY = e.touches[0].clientY;
  }

  if (e.touches.length === 2) {

    modoGesto = "movimiento";

    const a = e.touches[0];
    const b = e.touches[1];

    distanciaInicial = distancia(a, b);
    escalaInicial = escala;

    const centro = centroDedos(a, b);

    centroInicialX = centro.x;
    centroInicialY = centro.y;

    desplazamientoInicialX = desplazamientoX;
    desplazamientoInicialY = desplazamientoY;
  }

}, { passive: true });

/* MOVIMIENTO DE DEDOS */

visor.addEventListener("touchmove", e => {

  if (e.cancelable) {
    e.preventDefault();
  }

  /* UN DEDO: ROTAR */
  if (e.touches.length === 1 &&
      modoGesto === "rotacion") {

    const dedo = e.touches[0];

    rotY += (dedo.clientX - ultimoX) * 0.35;
    rotX -= (dedo.clientY - ultimoY) * 0.30;

    // Limite de 70 grados
    rotX = Math.max(-70, Math.min(70, rotX));
    rotY = Math.max(-70, Math.min(70, rotY));

    ultimoX = dedo.clientX;
    ultimoY = dedo.clientY;

    actualizarVista();
  }

  /* DOS DEDOS: ZOOM Y DESPLAZAMIENTO */
  if (e.touches.length === 2 &&
      modoGesto === "movimiento") {

    const a = e.touches[0];
    const b = e.touches[1];

    // Zoom
    if (distanciaInicial > 0) {

      const nuevaDistancia = distancia(a, b);

      escala = escalaInicial *
        (nuevaDistancia / distanciaInicial);

      escala = Math.max(
        0.5,
        Math.min(3, escala)
      );
    }

    // Movimiento en todas las direcciones
    const centro = centroDedos(a, b);

    desplazamientoX =
      desplazamientoInicialX +
      centro.x - centroInicialX;

    desplazamientoY =
      desplazamientoInicialY +
      centro.y - centroInicialY;

    actualizarVista();
  }

}, { passive: false });

/* FINALIZAR GESTO */

visor.addEventListener("touchend", e => {

  if (e.touches.length === 0) {
    modoGesto = "";
  }

  if (e.touches.length === 1) {
    modoGesto = "rotacion";

    ultimoX = e.touches[0].clientX;
    ultimoY = e.touches[0].clientY;
  }

  if (e.touches.length === 2) {
    modoGesto = "movimiento";

    const a = e.touches[0];
    const b = e.touches[1];

    const centro = centroDedos(a, b);

    distanciaInicial = distancia(a, b);
    escalaInicial = escala;

    centroInicialX = centro.x;
    centroInicialY = centro.y;

    desplazamientoInicialX = desplazamientoX;
    desplazamientoInicialY = desplazamientoY;
  }

});

visor.addEventListener("touchcancel", () => {
  modoGesto = "";
});

/* =================================
   CONTROLES DE MOUSE
================================= */

let mouseActivo = false;

visor.addEventListener("mousedown", e => {
  mouseActivo = true;
  ultimoX = e.clientX;
  ultimoY = e.clientY;
});

window.addEventListener("mouseup", () => {
  mouseActivo = false;
});

visor.addEventListener("mousemove", e => {

  if (!mouseActivo) return;

  rotY += (e.clientX - ultimoX) * 0.35;
  rotX -= (e.clientY - ultimoY) * 0.30;

  rotX = Math.max(-70, Math.min(70, rotX));
  rotY = Math.max(-70, Math.min(70, rotY));

  ultimoX = e.clientX;
  ultimoY = e.clientY;

  actualizarVista();
});

/* =================================
   REINICIAR POSICION
================================= */

document.getElementById("reiniciar")
  .addEventListener("click", () => {

    escala = 1;

    rotX = 0;
    rotY = 0;
    rotZ = 0;

    desplazamientoX = 0;
    desplazamientoY = 0;

    modoGesto = "";
    mouseActivo = false;

    actualizarVista();

  });

actualizarVista();

</script>

</body>
</html>
