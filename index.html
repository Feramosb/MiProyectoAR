<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Hospital Fernández - Plano AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #mensaje {
      position: fixed;
      top: 15px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      z-index: 999;
      pointer-events: none;
    }

    #reiniciar {
      position: fixed;
      bottom: 105px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border: none;
      border-radius: 30px;
      background: #176b55;
      color: white;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 3px 12px #0005;
      touch-action: manipulation;
    }

    canvas {
      touch-action: none;
    }
  </style>

  <script>
    AFRAME.registerComponent('controles-plano', {
      init: function () {
        const modelo = this.el;

        let escala = 1;
        let rx = 0;
        let ry = 0;
        let ultimoX = 0;
        let ultimoY = 0;
        let distanciaInicial = 0;
        let escalaInicial = 1;
        let arrastrando = false;

        function actualizar() {
          modelo.setAttribute(
            'rotation', `${rx} ${ry} 0`
          );
          modelo.setAttribute(
            'scale', `${escala} ${escala} ${escala}`
          );
        }

        function distancia(a, b) {
          return Math.hypot(
            a.clientX - b.clientX,
            a.clientY - b.clientY
          );
        }

        document.getElementById('reiniciar')
          .addEventListener('click', () => {
            escala = 1;
            rx = 0;
            ry = 0;
            arrastrando = false;
            actualizar();
          });

        const mensaje =
          document.getElementById('mensaje');

        const target = document.querySelector(
          '[mindar-image-target]'
        );

        target.addEventListener('targetFound', () => {
          mensaje.textContent =
            '4.º piso detectado. Girá con un dedo y ampliá con dos.';
        });

        target.addEventListener('targetLost', () => {
          mensaje.textContent =
            'Apuntá la cámara hacia la lámina.';
        });

        window.addEventListener('touchstart', e => {
          if (e.target.closest('#reiniciar')) return;

          if (e.touches.length === 1) {
            arrastrando = true;
            ultimoX = e.touches[0].clientX;
            ultimoY = e.touches[0].clientY;
          }

          if (e.touches.length === 2) {
            arrastrando = false;
            distanciaInicial = distancia(
              e.touches[0], e.touches[1]
            );
            escalaInicial = escala;
          }
        }, { passive: true });

        window.addEventListener('touchmove', e => {
          if (e.target.closest('#reiniciar')) return;

          if (e.cancelable) e.preventDefault();

          if (e.touches.length === 1 && arrastrando) {
            const t = e.touches[0];

            ry += (t.clientX - ultimoX) * 0.4;
            rx -= (t.clientY - ultimoY) * 0.3;

            rx = Math.max(-70, Math.min(70, rx));

            ultimoX = t.clientX;
            ultimoY = t.clientY;
            actualizar();
          }

          if (e.touches.length === 2 &&
              distanciaInicial > 0) {

            let nuevaDistancia = distancia(
              e.touches[0], e.touches[1]
            );

            escala = escalaInicial *
              nuevaDistancia / distanciaInicial;

            escala = Math.max(
              0.5, Math.min(3, escala)
            );

            actualizar();
          }
        }, { passive: false });

        window.addEventListener('touchend', e => {
          arrastrando = false;
          if (e.touches.length < 2) {
            distanciaInicial = 0;
          }
        });

        actualizar();
      }
    });
  </script>
</head>

<body>

  <div id="mensaje">
    Versión plana 2.0 - Apuntá hacia la lámina
  </div>

  <button id="reiniciar">
    ↺ Reiniciar posición
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="planta" src="./planta-4piso.png">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity
        id="modelo"
        controles-plano
        position="0 0 0.04">

        <a-plane
          src="#planta"
          width="1"
          height="0.75"
          material="shader: flat; side: double; transparent: true">
        </a-plane>

      </a-entity>

    </a-entity>

  </a-scene>

</body>
</html>
