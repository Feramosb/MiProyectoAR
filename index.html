
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Hospital Fernández - 4.º Piso</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #mensaje {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      padding: 12px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      z-index: 999;
      pointer-events: none;
    }

    #reiniciar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: #202b3a;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      z-index: 999;
      touch-action: manipulation;
    }

    canvas {
      touch-action: none;
    }
  </style>

  <script>
    AFRAME.registerComponent("plano-interactivo", {
      init: function () {
        const el = this.el;

        let escala = 1;
        let rotX = -25;
        let rotY = 0;

        let ultimoX = 0;
        let ultimoY = 0;
        let distanciaInicial = 0;
        let escalaInicial = 1;

        function distancia(a, b) {
          return Math.hypot(
            a.clientX - b.clientX,
            a.clientY - b.clientY
          );
        }

        function actualizar() {
          el.setAttribute(
            "rotation",
            `${rotX} ${rotY} 0`
          );

          el.setAttribute(
            "scale",
            `${escala} ${escala} ${escala}`
          );
        }

        function reiniciar() {
          escala = 1;
          rotX = -25;
          rotY = 0;
          actualizar();
        }

        document.querySelector("#reiniciar")
          .addEventListener("click", reiniciar);

        const mensaje = document.querySelector("#mensaje");
        const target = document.querySelector(
          "[mindar-image-target]"
        );

        target.addEventListener("targetFound", () => {
          mensaje.textContent =
            "4.º piso detectado. Arrastrá para rotar y usá dos dedos para ampliar.";
        });

        target.addEventListener("targetLost", () => {
          mensaje.textContent =
            "Apuntá la cámara hacia el póster del hospital.";
        });

        window.addEventListener("touchstart", (e) => {
          if (e.target.closest("#reiniciar")) return;

          if (e.touches.length === 1) {
            ultimoX = e.touches[0].clientX;
            ultimoY = e.touches[0].clientY;
          }

          if (e.touches.length === 2) {
            distanciaInicial = distancia(
              e.touches[0],
              e.touches[1]
            );
            escalaInicial = escala;
          }
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
          if (e.target.closest("#reiniciar")) return;
          if (e.cancelable) e.preventDefault();

          if (e.touches.length === 1) {
            const touch = e.touches[0];

            rotY += (touch.clientX - ultimoX) * 0.4;
            rotX -= (touch.clientY - ultimoY) * 0.25;

            rotX = Math.max(-70, Math.min(30, rotX));

            ultimoX = touch.clientX;
            ultimoY = touch.clientY;

            actualizar();
          }

          if (e.touches.length === 2 &&
              distanciaInicial > 0) {

            const nuevaDistancia = distancia(
              e.touches[0],
              e.touches[1]
            );

            escala = escalaInicial *
              (nuevaDistancia / distanciaInicial);

            escala = Math.max(
              0.5,
              Math.min(3, escala)
            );

            actualizar();
          }
        }, { passive: false });

        actualizar();
      }
    });
  </script>
</head>

<body>

  <div id="mensaje">
    Apuntá la cámara hacia el póster del hospital.
  </div>

  <button id="reiniciar">
    Reiniciar vista
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img
        id="planta"
        src="./planta-4piso.png">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      mindar-image-target="targetIndex: 0">

      <a-entity
        id="plano"
        plano-interactivo
        position="0 0 0.04">

        <a-plane
          src="#planta"
          width="1"
          height="0.75"
          material="shader: flat; side: double; transparent: true">
        </a-plane>

      </a-entity>

    </a-entity>

  </a-scene>

</body>
</html>
