
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>Hospital Fernández · Planos AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

/* =====================================
   ESTILOS GENERALES
===================================== */

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: transparent !important;
}

/* =====================================
   CAMARA Y REALIDAD AUMENTADA
===================================== */

/* La escena ocupa toda la pantalla */
a-scene {
  position: fixed !important;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
  z-index: 1;
  background: transparent !important;
}

/* El lienzo 3D debe ser transparente */
a-scene canvas.a-canvas {
  background: transparent !important;
}

/* Mantener el video de la camara al fondo */
video {
  z-index: 0 !important;
}

/* =====================================
   MENSAJE SUPERIOR
===================================== */

#mensaje {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  left: 5%;
  width: 90%;
  z-index: 55;
  text-align: center;
  color: white;
  background: rgba(14, 29, 43, 0.86);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 13px;
  line-height: 1.45;
  pointer-events: none;
}

/* =====================================
   BOTON FIJAR EN PANTALLA
===================================== */

#fijar {
  position: fixed;
  z-index: 60;
  bottom: max(26px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  background: #118f58;
  border: 1px solid #6ef0aa;
  color: white;
  padding: 15px 22px;
  border-radius: 30px;
  white-space: nowrap;
  font-size: 16px;
  font-weight: 700;
  box-shadow: 0 4px 16px #0008;
}

/* =====================================
   VISOR DEL PLANO FIJADO
===================================== */

#visor {
  position: fixed;
  inset: 70px 0 225px;
  z-index: 30;
  display: none;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  perspective: 900px;
}

#modelo {
  position: relative;
  width: min(90vw, 55vh);
  transform-style: preserve-3d;
  transform-origin: center center;
  will-change: transform;
  touch-action: none;
  flex: none;
}

#planta {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* =====================================
   RESALTADOS VERDES
===================================== */

#capas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.resaltado {
  fill: #00ea70;
  fill-opacity: 0.56;
  stroke: #08783b;
  stroke-width: 3;
}

/* =====================================
   MENU INFERIOR
===================================== */

#panel {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 65;
  display: none;
  background: rgba(14, 29, 43, 0.96);
  color: white;
  padding: 12px 12px max(14px, env(safe-area-inset-bottom));
  border-radius: 17px 17px 0 0;
  max-height: 48vh;
  overflow: auto;
}

#titulo {
  text-align: center;
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 9px;
}

#pisos,
#sectores,
#acciones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 7px;
}

button {
  font-family: inherit;
  touch-action: manipulation;
  cursor: pointer;
  border-radius: 10px;
  border: 1px solid #5b7681;
  color: white;
  background: #284357;
  padding: 10px 6px;
  font-size: 12px;
}

button.activo {
  background: #148958;
  border-color: #88f9b3;
  font-weight: 700;
}

#acciones button {
  background: #506478;
}

#subtitulo {
  font-size: 12px;
  text-align: center;
  color: #d8e9ee;
  margin-top: 9px;
}

/* Ocultar scanner despues de fijar */
body.fijado .mindar-ui-scanning {
  display: none !important;
}

</style>
</head>

<body>

<!-- =====================================
     MENSAJE INICIAL
===================================== -->

<div id="mensaje">
  Escaneá la lámina para visualizar el plano
  en realidad aumentada.
</div>

<!-- =====================================
     BOTON FIJAR
===================================== -->

<button id="fijar" type="button">
  📌 Fijar en pantalla
</button>

<!-- =====================================
     VISOR INTERACTIVO
===================================== -->

<div id="visor">

  <div id="modelo">

    <img
      id="planta"
      src="./planta-4piso.png"
      alt="Plano del hospital"
      draggable="false">

    <svg
      id="capas"
      viewBox="0 0 577 433"
      preserveAspectRatio="none">
    </svg>

  </div>

</div>

<!-- =====================================
     MENU DE PISOS Y SECTORES
===================================== -->

<div id="panel">

  <div id="titulo">
    Hospital Fernández · Explorar pisos
  </div>

  <div id="pisos">

    <button type="button" data-piso="PB">
      Planta Baja
    </button>

    <button type="button" data-piso="4">
      4.º Piso
    </button>

  </div>

  <div id="subtitulo">
    Seleccioná un sector para resaltarlo en verde
  </div>

  <div id="sectores"></div>

  <div id="acciones">

    <button type="button" id="limpiar">
      Limpiar sector
    </button>

    <button type="button" id="reiniciar">
      ↺ Reiniciar posición
    </button>

  </div>

</div>

<!-- =====================================
     ESCENA REALIDAD AUMENTADA
===================================== -->

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    uiScanning: yes;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
    warmupTolerance: 8;
    missTolerance: 10;
  "
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">


  <a-assets>
    <img
      id="ar-plano-img"
      src="./planta-4piso.png"
      crossorigin="anonymous">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="marcador"
    mindar-image-target="targetIndex: 0">

    <a-plane
      id="ar-plano"
      position="0 0 0.30"
      width="1"
      height="0.75"
      material="src: #ar-plano-img; shader: flat; transparent: true; side: double; depthWrite: false">
    </a-plane>

  </a-entity>

</a-scene>

<script>

/* =====================================
   CONFIGURACION DE LOS DOS PISOS
===================================== */

const pisos = {

  '4': {

    imagen: './planta-4piso.png',
    ancho: 577,
    alto: 433,

    sectores: [

      {
        nombre: 'Administrativa',
        areas: [
          [261,174,70,50]
        ]
      },

      {
        nombre: 'Obstetricia Guardia',
        areas: [
          [330,192,84,64]
        ]
      },

      {
        nombre: 'Internación',
        areas: [
          [119,27,55,167],
          [405,27,58,167],
          [172,193,94,65]
        ]
      },

      {
        nombre: 'Acceso Sector',
        areas: [
          [92,179,34,80],
          [254,245,75,35],
          [461,179,30,80]
        ]
      },

      {
        nombre: 'Sector 5',
        areas: [
          [119,260,56,150]
        ]
      },

      {
        nombre: 'Sector 6',
        areas: [
          [405,260,59,145]
        ]
      }

    ]
  },

  'PB': {

    imagen: './planta-baja.png',
    ancho: 1122,
    alto: 1402,

    sectores: [

      {
        nombre: 'Pediatría y Neonatología',
        areas: [
          [790,820,68,340]
        ]
      },

      {
        nombre: 'Obstetricia / Ginecología',
        areas: [
          [898,820,65,340]
        ]
      },

      {
        nombre: 'Tokens de confirmación',
        areas: [
          [470,728,153,62]
        ]
      },

      {
        nombre: 'Laboratorio',
        areas: [
          [113,622,140,67]
        ]
      },

      {
        nombre: 'Turnos',
        areas: [
          [875,622,77,67]
        ]
      },

      {
        nombre: 'Sector de acceso',
        areas: [
          [47,650,59,150],
          [475,792,151,70],
          [969,650,60,150]
        ]
      }

    ]
  }
};

/* =====================================
   ELEMENTOS
===================================== */

const $ = id => document.getElementById(id);

const visor = $('visor');
const modelo = $('modelo');
const planta = $('planta');
const capas = $('capas');
const panel = $('panel');
const mensaje = $('mensaje');
const fijar = $('fijar');

/* =====================================
   ESTADO GENERAL
===================================== */

let detectado = false;
let fijado = false;
let pisoActual = '4';

let escala = 1;
let rotX = 0;
let rotY = 0;

let desplazamientoX = 0;
let desplazamientoY = 0;

/* =====================================
   ESTADO DE GESTOS
===================================== */

let gesto = '';

let ultimoX = 0;
let ultimoY = 0;

let distanciaInicial = 0;
let escalaInicial = 1;

let centroInicialX = 0;
let centroInicialY = 0;

let desplazamientoInicialX = 0;
let desplazamientoInicialY = 0;

/* =====================================
   FUNCIONES GENERALES
===================================== */

const limitar = (v, a, b) =>
  Math.max(a, Math.min(b, v));

function actualizarVista() {

  modelo.style.transform = `
    translate(
      ${desplazamientoX}px,
      ${desplazamientoY}px
    )
    rotateX(${rotX}deg)
    rotateY(${rotY}deg)
    scale(${escala})
  `;
}

function reiniciar() {

  escala = 1;

  rotX = 0;
  rotY = 0;

  desplazamientoX = 0;
  desplazamientoY = 0;

  gesto = '';

  actualizarVista();
}

function limpiar() {

  capas.replaceChildren();

  document.querySelectorAll('[data-sector]')
    .forEach(boton => {
      boton.classList.remove('activo');
    });

}

/* =====================================
   RESALTAR SECTOR
===================================== */

function sector(numero) {

  limpiar();

  const configuracion =
    pisos[pisoActual].sectores[numero];

  if (!configuracion) return;

  configuracion.areas.forEach(([x,y,w,h]) => {

    const figura = document.createElementNS(
      'http://www.w3.org/2000/svg',
      'rect'
    );

    figura.setAttribute('x', x);
    figura.setAttribute('y', y);
    figura.setAttribute('width', w);
    figura.setAttribute('height', h);

    figura.setAttribute(
      'rx',
      Math.min(w,h) / 5
    );

    figura.setAttribute('class', 'resaltado');

    capas.appendChild(figura);

  });

  const boton = document.querySelector(
    `[data-sector="${numero}"]`
  );

  if (boton) {
    boton.classList.add('activo');
  }
}

/* =====================================
   CAMBIAR DE PISO
===================================== */

function elegirPiso(piso) {

  pisoActual = piso;

  const configuracion = pisos[piso];

  planta.src = configuracion.imagen;

  modelo.style.aspectRatio =
    configuracion.ancho + ' / ' +
    configuracion.alto;

  capas.setAttribute(
    'viewBox',
    `0 0 ${configuracion.ancho} ${configuracion.alto}`
  );

  const lista = $('sectores');

  lista.replaceChildren();

  configuracion.sectores.forEach((s, i) => {

    const boton = document.createElement('button');

    boton.type = 'button';
    boton.dataset.sector = i;

    boton.textContent =
      (i + 1) + '. ' + s.nombre;

    boton.addEventListener('click', () => {
      sector(i);
    });

    lista.appendChild(boton);

  });

  document.querySelectorAll('[data-piso]')
    .forEach(boton => {

      boton.classList.toggle(
        'activo',
        boton.dataset.piso === piso
      );

    });

  limpiar();
  reiniciar();
}

/* =====================================
   DETECTAR PLANTA EN REALIDAD AUMENTADA
===================================== */

$('marcador').addEventListener(
  'targetFound',
  () => {

    if (detectado) return;

    detectado = true;

    fijar.style.display = 'block';

    mensaje.textContent =
      '¡Plano detectado! Está vinculado a la lámina. Tocá «Fijar en pantalla» para explorarlo.';

  }
);

/* =====================================
   FIJAR EN PANTALLA
===================================== */

fijar.addEventListener('click', () => {

  if (!detectado || fijado) return;

  fijado = true;

  document.body.classList.add('fijado');

  fijar.style.display = 'none';

  /* Ocultar plano vinculado al marcador */
  $('ar-plano').setAttribute(
    'visible',
    false
  );

  /* Mostrar plano independiente */
  visor.style.display = 'flex';

  /* Mostrar menu */
  panel.style.display = 'block';

  /* Elegir cuarto piso inicialmente */
  elegirPiso('4');

  /* Mostrar instrucciones */
  mensaje.innerHTML = `
    <strong>Plano fijado en pantalla</strong><br>
    1 dedo: girar · 2 dedos: mover<br>
    Pellizcá con 2 dedos para ampliar o reducir
  `;

});

/* =====================================
   BOTONES DE PISOS Y SECTORES
===================================== */

document.querySelectorAll('[data-piso]')
  .forEach(boton => {

    boton.addEventListener('click', () => {
      elegirPiso(boton.dataset.piso);
    });

  });

$('limpiar').addEventListener(
  'click',
  limpiar
);

$('reiniciar').addEventListener(
  'click',
  reiniciar
);

/* =====================================
   CALCULO DE GESTOS
===================================== */

const distancia = (a, b) =>
  Math.hypot(
    a.clientX - b.clientX,
    a.clientY - b.clientY
  );

const centro = (a, b) => ({
  x: (a.clientX + b.clientX) / 2,
  y: (a.clientY + b.clientY) / 2
});

/* =====================================
   INICIAR MOVIMIENTO CON DOS DEDOS
===================================== */

function iniciarDos(a, b) {

  gesto = 'dos';

  distanciaInicial = distancia(a, b);

  escalaInicial = escala;

  const c = centro(a, b);

  centroInicialX = c.x;
  centroInicialY = c.y;

  desplazamientoInicialX = desplazamientoX;
  desplazamientoInicialY = desplazamientoY;
}

/* =====================================
   INICIO DE TOQUE
===================================== */

visor.addEventListener('touchstart', e => {

  if (e.touches.length === 1) {

    gesto = 'uno';

    ultimoX = e.touches[0].clientX;
    ultimoY = e.touches[0].clientY;

  } else if (e.touches.length === 2) {

    iniciarDos(
      e.touches[0],
      e.touches[1]
    );

  }

}, { passive: true });

/* =====================================
   MOVIMIENTO DE TOQUE
===================================== */

visor.addEventListener('touchmove', e => {

  if (e.cancelable) {
    e.preventDefault();
  }

  /* UN DEDO: ROTAR */

  if (
    e.touches.length === 1 &&
    gesto === 'uno'
  ) {

    const dedo = e.touches[0];

    rotY = limitar(
      rotY + (dedo.clientX - ultimoX) * 0.35,
      -70,
      70
    );

    rotX = limitar(
      rotX - (dedo.clientY - ultimoY) * 0.30,
      -70,
      70
    );

    ultimoX = dedo.clientX;
    ultimoY = dedo.clientY;

    actualizarVista();
  }

  /* DOS DEDOS: MOVER Y ZOOM */

  else if (
    e.touches.length === 2 &&
    gesto === 'dos'
  ) {

    const a = e.touches[0];
    const b = e.touches[1];

    const c = centro(a, b);

    if (distanciaInicial > 0) {

      escala = limitar(
        escalaInicial *
        distancia(a, b) /
        distanciaInicial,
        0.5,
        3
      );

    }

    desplazamientoX =
      desplazamientoInicialX +
      c.x - centroInicialX;

    desplazamientoY =
      desplazamientoInicialY +
      c.y - centroInicialY;

    actualizarVista();
  }

}, { passive: false });

/* =====================================
   FINALIZAR TOQUE
===================================== */

visor.addEventListener('touchend', e => {

  if (e.touches.length === 0) {

    gesto = '';

  } else if (e.touches.length === 1) {

    gesto = 'uno';

    ultimoX = e.touches[0].clientX;
    ultimoY = e.touches[0].clientY;

  } else if (e.touches.length === 2) {

    iniciarDos(
      e.touches[0],
      e.touches[1]
    );

  }

});

visor.addEventListener('touchcancel', () => {
  gesto = '';
});

/* =====================================
   CONTROLES DE MOUSE
===================================== */

let mouse = false;

visor.addEventListener('mousedown', e => {

  mouse = true;
  ultimoX = e.clientX;
  ultimoY = e.clientY;

});

window.addEventListener('mouseup', () => {
  mouse = false;
});

visor.addEventListener('mousemove', e => {

  if (!mouse) return;

  rotY = limitar(
    rotY + (e.clientX - ultimoX) * 0.35,
    -70,
    70
  );

  rotX = limitar(
    rotX - (e.clientY - ultimoY) * 0.30,
    -70,
    70
  );

  ultimoX = e.clientX;
  ultimoY = e.clientY;

  actualizarVista();
});

/* =====================================
   INICIALIZACION
===================================== */

elegirPiso('4');

</script>

</body>
</html>
